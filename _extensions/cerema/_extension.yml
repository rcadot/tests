title: Cerema
author: Romain Cadot
version: 1.1.0
# Typst 0.12 (Quarto 1.6) requis pour les titres « sticky » du format typst.
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      theme: [default, cerema.scss]
      # Diapositive 16:9 ; 1 pt du modèle PowerPoint (960 x 540 pt) = 4/3 px.
      width: 1280
      height: 720
      margin: 0
      center: false
      transition: none
      background-transition: none
      slide-number: false
      lang: fr
      date-format: "MMMM YYYY"
      fig-align: center
      template-partials:
        - title-slide.html
      include-in-header:
        - cerema-header.html
      include-after-body:
        - cerema-after-body.html
      filters:
        - cerema.lua
      format-resources:
        - assets/cerema-logo.svg
        - assets/cerema-rf.svg
        - assets/cerema-halo.png
        - fonts/Marianne-Light.otf
        - fonts/Marianne-Regular.otf
        - fonts/Marianne-RegularItalic.otf
        - fonts/Marianne-Medium.otf
        - fonts/Marianne-Bold.otf
        - fonts/Marianne-BoldItalic.otf
        - fonts/Marianne-ExtraBold.otf
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      papersize: a4
      lang: fr
      region: FR
      # Le sommaire stylisé est produit par le gabarit ; toc: false le retire.
      toc: true
      toc-depth: 3
      date-format: "MMMM YYYY"
      crossref:
        tbl-title: "Tableau"
        fig-title: "Figure"
        tbl-prefix: "Tableau"
        fig-prefix: "Figure"
      execute:
        echo: false
        warning: false
