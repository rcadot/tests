title: Cerema
author: Romain Cadot
version: 1.3.1
# Typst 0.12 (Quarto 1.6) requis pour les titres « sticky » du format typst.
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      # rapport.diapo.html : ne pas écraser rapport.html du format cerema-html.
      output-ext: diapo.html
      theme: [default, revealjs/cerema.scss, commun/cerema-jetons.scss, commun/cerema-ressources.scss]
      # Diapositive 16:9 ; 1 pt du modèle PowerPoint (960 x 540 pt) = 4/3 px.
      width: 1280
      height: 720
      margin: 0
      center: false
      transition: none
      background-transition: none
      slide-number: false
      lang: fr
      date-format: "MMMM YYYY"
      fig-align: center
      crossref:
        tbl-title: "Tableau"
        fig-title: "Figure"
        tbl-prefix: "Tableau"
        fig-prefix: "Figure"
      template-partials:
        - revealjs/title-slide.html
      include-in-header:
        - revealjs/cerema-header.html
      include-after-body:
        - revealjs/cerema-after-body.html
      filters:
        - revealjs/cerema.lua
    typst:
      template-partials:
        - typst/typst-template.typ
        - typst/typst-show.typ
      papersize: a4
      lang: fr
      region: FR
      font-paths: commun/polices
      # Le sommaire stylisé est produit par le gabarit ; toc: false le retire.
      toc: true
      toc-depth: 3
      date-format: "MMMM YYYY"
      crossref:
        tbl-title: "Tableau"
        fig-title: "Figure"
        tbl-prefix: "Tableau"
        fig-prefix: "Figure"
      execute:
        echo: false
        warning: false
    pptx:
      # Construit depuis sources/Modele_Diaporama_Cerema_2026.potx par
      # outils/construire_reference_pptx.py (dispositions renommées pour Pandoc).
      reference-doc: pptx/reference.pptx
      filters:
        - pptx/cerema-pptx.lua
      lang: fr
      date-format: "MMMM YYYY"
      slide-level: 2
      crossref:
        tbl-title: "Tableau"
        fig-title: "Figure"
        tbl-prefix: "Tableau"
        fig-prefix: "Figure"
      execute:
        echo: false
        warning: false
    docx:
      # Construit depuis le fichier de référence de Pandoc par
      # outils/construire_reference_docx.py.
      reference-doc: docx/reference.docx
      filters:
        - docx/cerema-docx.lua
      lang: fr
      date-format: "MMMM YYYY"
      toc: true
      toc-depth: 3
      toc-title: "Sommaire"
      fig-dpi: 200
      crossref:
        tbl-title: "Tableau"
        fig-title: "Figure"
        tbl-prefix: "Tableau"
        fig-prefix: "Figure"
      execute:
        echo: false
        warning: false
    html:
      theme: [cosmo, html/cerema-html.scss, commun/cerema-jetons.scss, commun/cerema-ressources.scss]
      # Colonne de contenu élargie (800 px par défaut dans Quarto)
      grid:
        body-width: 1050px
      lang: fr
      date-format: "MMMM YYYY"
      toc: true
      toc-title: "Sommaire"
      include-in-header:
        - html/cerema-html-header.html
      include-before-body:
        - html/cerema-html-bandeau.html
      crossref:
        tbl-title: "Tableau"
        fig-title: "Figure"
        tbl-prefix: "Tableau"
        fig-prefix: "Figure"
