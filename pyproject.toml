[project]
name = "cerema-quarto"
version = "1.3.0"
description = "Extension Quarto Cerema : rapport PDF, Word, PowerPoint, pages HTML et revealjs"
requires-python = ">=3.10"
dependencies = [
    "altair>=6.2.2",
    "jupyter>=1.1.1",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "vl-convert-python>=1.7.0",
]

[dependency-groups]
dev = [
    "fonttools[woff]>=4.50",
    "pillow>=10",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

# Le module cerema_altair vit dans l'extension : uv sync l'installe dans
# l'environnement, ce qui le rend importable depuis tout document du projet.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["_extensions/cerema/python/cerema_altair"]
